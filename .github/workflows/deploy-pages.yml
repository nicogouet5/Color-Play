name: Deploy Color-Play Ripley prototype

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Install locked build dependencies
        run: npm ci --prefix work --no-audit --no-fund
      - name: Typecheck
        run: npm --prefix work run typecheck
      - name: Build current prototype
        run: npm --prefix work run build:prototype
      - uses: actions/configure-pages@v5
      - name: Publish only the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
